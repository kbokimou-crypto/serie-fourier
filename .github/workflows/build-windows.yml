name: Build Windows exe

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Fabriquer l'exe
        run: pyinstaller --noconfirm --onefile --windowed --name SerieFourier --hidden-import PIL._tkinter_finder fourier_app.py
      - name: Fabriquer l'installateur
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: SerieFourier-windows
          path: |
            dist/SerieFourier.exe
            Output/SerieFourier_Setup.exe
